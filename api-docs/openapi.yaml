        condition:
          type: string
          enum: [Sehr gut, Gut, Akzeptabel, Reparaturbedürftig, Defekt]
          example: Gut
        acquisitionDate:
          type: string
          format: date
          example: "2024-03-15"
        acquisitionCost:
          type: number
          example: 180.00
        position:
