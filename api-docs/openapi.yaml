          example:
            - Arbeitstisch liftmatisch höhenverstellbar
            - Akustik-Tischaufsatz
            - Drehstuhl
            - IT-Ausstattung

    # ── Floor Plans ────────────────────────────────
    FloorPlanGeoJSON:
      type: object
      description: GeoJSON FeatureCollection mit Räumen und Assets
      properties:
        type:
          type: string
          example: FeatureCollection
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: Feature
              geometry:
                type: object
                description: GeoJSON Polygon
              properties:
                type: object
                properties:
                  featureType:
                    type: string
                    enum: [room, asset]
                  id:
                    type: string

