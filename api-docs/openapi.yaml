          type: string
          example: "1"
        title:
          type: string
          example: "Modul 1 – Standardarbeitsplatz"
        description:
          type: string
          example: "Der Standardarbeitsplatz gestaltet sich als Schreibtischarbeitsplatz..."
        photo:
          type: string
        areaPerWorkspace:
          type: string
          example: "3.0 m²"
        elements:
          type: array
          items:
