          enum: [Sehr gut, Gut, Akzeptabel, Reparaturbedürftig]
        price:
          type: number
        description:
          type: string

    # ── Orders ─────────────────────────────────────
    Order:
      type: object
      properties:
        orderId:
          type: string
          example: ORD-2026-000042
        status:
          type: string
          enum: [Entwurf, Übermittelt, In Bearbeitung, Teilgeliefert, Geliefert, Abgeschlossen, Storniert]
          example: Übermittelt
        orderDate:
          type: string
          format: date-time
        organization:
          type: string
          example: Bundesamt für Bauten und Logistik
        costCenter:
          type: string
          example: KST-4200-001
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: number
          example: 540.00
        currency:
          type: string
          example: CHF

    OrderItem:
      type: object
      properties:
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        lineTotal:
          type: number

    OrderCreate:
      type: object
      required: [organization, items, deliveryAddress]
      properties:
        organization:
          type: string
          example: Bundesamt für Bauten und Logistik
        costCenter:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
          format: email
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: integer
              quantity:
                type: integer
                minimum: 1
        deliveryAddress:
          type: object
          properties:
            buildingName:
              type: string
            floor:
              type: string
            street:
              type: string
            postalCode:
              type: string
            city:
              type: string
        deliveryNotes:
          type: string

